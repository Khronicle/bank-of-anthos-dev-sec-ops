# k3s ships Traefik as the default ingress controller — this is the only
# inbound path into the cluster. Traefik itself is exposed via k3s's bundled
# servicelb (see terraform/user_data.sh.tftpl), which binds the node's host
# ports 80/443 to the Traefik Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
