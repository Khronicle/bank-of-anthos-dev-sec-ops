# ECR auth tokens expire after 12h — without this, imagePullSecrets go stale
# and new pods (e.g. after a node reboot) fail to pull images. Runs every 6h,
# using the EC2 node's IAM instance-profile credentials (reachable via IMDS
# from any pod on this single-node cluster) to mint a fresh token and rewrite
# the `regcred` Secret that every Deployment's imagePullSecrets references.
#
# NOTE: the ecr-registry-config ConfigMap consumed below is defined as a
# configMapGenerator in kustomization.yaml (not a static resource here) —
# cd.yml overwrites its two literals at deploy time via
# `kustomize edit add configmap ecr-registry-config --from-literal=... --behavior=merge`,
# which only works against a generator entry, not a plain ConfigMap object.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-cred-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-cred-refresher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["regcred"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-cred-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-cred-refresher
roleRef:
  kind: Role
  name: ecr-cred-refresher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-credential-refresh
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-cred-refresher
          restartPolicy: Never
          initContainers:
            - name: fetch-token
              image: public.ecr.aws/aws-cli/aws-cli:2.17.62
              envFrom:
                - configMapRef:
                    name: ecr-registry-config
              command:
                - sh
                - -c
                - "aws ecr get-login-password --region $AWS_REGION > /shared/token"
              volumeMounts:
                - mountPath: /shared
                  name: shared
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 20m
                  memory: 64Mi
          containers:
            - name: apply-secret
              image: bitnami/kubectl:1.31
              envFrom:
                - configMapRef:
                    name: ecr-registry-config
              command:
                - sh
                - -c
                - |
                  kubectl create secret docker-registry regcred \
                    --docker-server="$ECR_REGISTRY" \
                    --docker-username=AWS \
                    --docker-password="$(cat /shared/token)" \
                    --dry-run=client -o yaml | kubectl apply -f -
              volumeMounts:
                - mountPath: /shared
                  name: shared
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 20m
                  memory: 64Mi
          volumes:
            - name: shared
              emptyDir: {}
