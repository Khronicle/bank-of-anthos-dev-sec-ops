# Adapted from kubernetes-manifests/ledger-writer.yaml: istio annotation dropped,
# GCP tracing/metrics disabled, JVM heap capped hard (-Xmx192m, down from 512m)
# and resources trimmed to fit alongside 7 other services on 1GB RAM.
apiVersion: v1
kind: Service
metadata:
  labels:
    application: bank-of-anthos
    environment: development
    team: ledger
    tier: backend
  name: ledgerwriter
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: ledgerwriter
    application: bank-of-anthos
    environment: development
    team: ledger
    tier: backend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    application: bank-of-anthos
    environment: development
    team: ledger
    tier: backend
  name: ledgerwriter
spec:
  selector:
    matchLabels:
      app: ledgerwriter
      application: bank-of-anthos
      environment: development
      team: ledger
      tier: backend
  template:
    metadata:
      labels:
        app: ledgerwriter
        application: bank-of-anthos
        environment: development
        team: ledger
        tier: backend
    spec:
      containers:
        - env:
            - name: VERSION
              value: v0.6.10-aws
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: ENABLE_METRICS
              value: "false"
            - name: JVM_OPTS
              value: -XX:+UnlockExperimentalVMOptions -XX:MaxRAMPercentage=75 -Xms96m -Xmx192m
            - name: LOG_LEVEL
              value: info
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: environment-config
            - configMapRef:
                name: service-api-config
            - configMapRef:
                name: ledger-db-config
            - secretRef:
                name: ledger-db-secret
          image: bank-of-anthos/ledgerwriter:latest
          name: ledgerwriter
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 300m
              ephemeral-storage: 0.5Gi
              memory: 320Mi
            requests:
              cpu: 100m
              ephemeral-storage: 0.5Gi
              memory: 150Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - all
            privileged: false
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/.ssh
              name: publickey
              readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: bank-of-anthos
      imagePullSecrets:
        - name: regcred
      terminationGracePeriodSeconds: 5
      volumes:
        - emptyDir: {}
          name: tmp
        - name: publickey
          secret:
            items:
              - key: jwtRS256.key.pub
                path: publickey
            secretName: jwt-key
