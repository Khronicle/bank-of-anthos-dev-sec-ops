# Checkov configuration — Stage 9 (IaC scanning)
#
# Every entry in skip-check below is a DELIBERATE, DOCUMENTED risk acceptance,
# not noise suppression. Baseline at time of writing: 94 passed, 36 failed.
#
# Three grounds for acceptance are used, and each skip states which applies:
#   [FREE-TIER]    the control costs money the project's budget forbids
#                  (this stack targets AWS free tier with a $5/mo budget alarm)
#   [BY-DESIGN]    the control contradicts an intentional architecture decision
#   [NOT-APPLICABLE] the control targets a resource or pattern we don't use
#
# Re-run the baseline after any terraform change:
#   checkov -d terraform --framework terraform --compact --quiet

directory:
  - terraform

framework:
  - terraform

quiet: true
compact: true

skip-check:
  # ---------------------------------------------------------------------
  # Encryption-at-rest with customer-managed KMS keys
  # ---------------------------------------------------------------------
  # [FREE-TIER] All of these resources ARE encrypted at rest — with the
  # AWS-managed default key (SSE-S3 for S3, AES256 for ECR), which is free.
  # Checkov requires a customer-managed CMK, which bills ~$1/month per key
  # plus per-request charges. At 8 ECR repos + 2 buckets + 1 topic + 1 table
  # that is roughly $12/month against a $5/month budget.
  # Residual risk: no independent key rotation policy or per-key access
  # control. Acceptable for a non-production demo holding no real customer
  # data. Revisit if this ever handles real PII.
  - CKV_AWS_136 # ECR repositories encrypted with KMS (x8)
  - CKV_AWS_145 # S3 buckets encrypted with KMS (x2)
  - CKV_AWS_26  # SNS topic encryption
  - CKV_AWS_119 # DynamoDB encrypted with KMS CMK

  # ---------------------------------------------------------------------
  # S3 durability / auditing features
  # ---------------------------------------------------------------------
  # [FREE-TIER] Cross-region replication doubles storage cost and egress.
  # Access logging needs a second bucket that itself accrues storage.
  # The deploy-artifacts bucket holds rendered manifests that are
  # regenerated by CI on every deploy — they are reproducible, not precious.
  - CKV_AWS_144 # S3 cross-region replication (x2)
  - CKV_AWS_18  # S3 access logging (x2)
  # [NOT-APPLICABLE] No event-driven consumers of either bucket exist.
  - CKV2_AWS_62 # S3 event notifications (x2)
  # [BY-DESIGN] Terraform state must be retained indefinitely; expiring it
  # is precisely what we do NOT want.
  - CKV2_AWS_61 # S3 lifecycle configuration on tf_state

  # ---------------------------------------------------------------------
  # Network exposure
  # ---------------------------------------------------------------------
  # [BY-DESIGN] This is a public-facing web application on a single-node
  # k3s box with a public IP and no NAT gateway (NAT costs ~$32/month, which
  # alone would be 6x the entire budget). Port 80 open to the world is the
  # product working as intended; the subnet is public for the same reason.
  - CKV_AWS_260 # ingress 0.0.0.0/0 to port 80
  - CKV_AWS_130 # subnet assigns public IP by default
  # [BY-DESIGN] Egress is unrestricted so the node can pull container images
  # from ECR and reach the SSM and CloudWatch endpoints. Locking this to VPC
  # endpoints is the correct hardening, but interface endpoints bill ~$7/month
  # each and there would be several.
  - CKV_AWS_382 # egress 0.0.0.0/0
  # [NOT-APPLICABLE] Port 22 is only opened when var.ssh_cidr_blocks is
  # non-empty, and it defaults to []. Deployment uses SSM Session Manager,
  # not SSH. Checkov evaluates the dynamic block statically and cannot see
  # the default. If you ever populate ssh_cidr_blocks, scope it to a /32.
  - CKV_AWS_24 # ingress 0.0.0.0/0 to port 22
  # [NOT-APPLICABLE] Nothing is attached to the default security group; all
  # resources use aws_security_group.node explicitly.
  - CKV2_AWS_12 # default security group restricts all traffic
  # [FREE-TIER] VPC flow logs bill on CloudWatch Logs ingestion + storage,
  # which is the single easiest way to blow a $5/month budget on a box that
  # serves public HTTP traffic. This is the acceptance most worth revisiting
  # first if the budget ever increases — flow logs are the main network
  # forensics capability being given up here.
  - CKV2_AWS_11 # VPC flow logging

  # ---------------------------------------------------------------------
  # Cost-bearing operational features
  # ---------------------------------------------------------------------
  # [FREE-TIER] EC2 detailed monitoring is a paid feature (1-minute metrics).
  # The CloudWatch agent already publishes the memory metric that the
  # Stage 12 alarm in monitoring.tf actually depends on.
  - CKV_AWS_126 # EC2 detailed monitoring
  # [NOT-APPLICABLE] The DynamoDB lock table is no longer used — terraform/
  # backend.tf moved to S3 native locking (use_lockfile). The table and this
  # finding both disappear when bootstrap is cleaned up.
  - CKV_AWS_28 # DynamoDB point-in-time recovery

  # ---------------------------------------------------------------------
  # RETIRED — the resource these applied to no longer exists. See note below.
  # ---------------------------------------------------------------------
  # This block used to skip CKV_AWS_107/109/110/111/356 for the GitHub
  # Actions OIDC role's ManageProjectInfra statement (ec2:* plus
  # iam:CreateRole/AttachRolePolicy/PassRole on resources = ["*"]) — a real
  # privilege-escalation path Checkov was right to flag, accepted here only
  # because that role genuinely needed those permissions.
  #
  # That role (aws_iam_role.github_actions in terraform/bootstrap/main.tf)
  # was deleted when CI moved from OIDC to a static IAM user's access keys
  # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY GitHub secrets — see
  # terraform/bootstrap/README.md and CAPSTONE_DEVSECOPS_DEPLOYMENT.md stage
  # 0). No skip-checks are needed for it anymore: with the resource gone,
  # Checkov has nothing left to flag under these IDs.
  #
  # This does NOT mean the risk is gone — it moved somewhere Checkov cannot
  # see it. The IAM user itself (its permissions, its access-key lifecycle)
  # isn't managed by this Terraform stack, so no amount of `terraform plan`
  # scanning will ever catch a change to it. Per the informed trade-off
  # documented in terraform/bootstrap/README.md, that user has admin-access
  # permissions with no repo/ref scoping and no expiry — broader and
  # longer-lived than the role this section used to describe.
  #
  # .github/workflows/audit-iam-user.yml tracks this risk on its own weekly
  # schedule (independent of terraform changes, since this resource isn't
  # terraform-managed and this file's "re-run after any terraform change"
  # header would otherwise never fire for it) and posts the user's current
  # attached/inline policies to the job summary every run.

  # ---------------------------------------------------------------------
  # Low-value / cosmetic
  # ---------------------------------------------------------------------
  # [NOT-APPLICABLE] Every ingress rule carries a description; the finding is
  # on the egress rule, where "allow all outbound" needs no further prose.
  - CKV_AWS_23 # security group rule descriptions
  # [NOT-APPLICABLE] t3 instances are EBS-optimized by default and the
  # attribute cannot be disabled on them; setting it changes nothing.
  - CKV_AWS_135 # EC2 EBS optimized
