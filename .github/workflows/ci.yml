name: ci

# Section 7 stages 1-5, gating every PR before it can merge to main:
# secrets scan, build+unit test, SCA, SAST, and IaC scan.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: "Stage 2: Gitleaks secrets scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action posts findings as PR review comments. The workflow-level
      # `contents: read` strips every other scope, so without this the scan runs
      # but silently fails to report. Set GITLEAKS_ENABLE_COMMENTS=false instead
      # if you'd rather keep the token read-only.
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped false-positive allowlists, each justified in the file itself.
          # Without this the scan fails on Kubernetes Secret volume projections
          # (which name key material by filename, not value) and on upstream's
          # public demo keypair carried in inherited history.
          GITLEAKS_CONFIG: .gitleaks.toml

  build-test-python:
    name: "Stage 3: build+test (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, accounts/userservice, accounts/contacts]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        working-directory: src/${{ matrix.service }}
        run: uv sync --group dev
      - name: Run tests
        working-directory: src/${{ matrix.service }}
        # frontend has no tests/ directory in this fork (documented gap —
        # see CAPSTONE_DEVSECOPS_DEPLOYMENT.md troubleshooting section);
        # dependency install above still catches broken requirements.
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "No tests/ directory for ${{ matrix.service }} — skipping pytest, dependency install already verified above."
          fi

  build-test-java:
    name: "Stage 3: build+test (ledger services)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./mvnw -B test

  sca-trivy-fs:
    name: "Stage 4: Trivy SCA (filesystem scan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned with the `v` prefix: upstream re-tagged every release in March
      # 2026, which deleted the old bare `0.28.0` tag this used to point at and
      # broke resolution. Consider pinning to a commit SHA — a tag is a mutable
      # pointer, and that mutability is exactly what bit us here.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  sast-semgrep:
    name: "Stage 5: Semgrep SAST"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # `semgrep ci` diffs against the merge base
      # `semgrep scan --error` failed the job on ANY finding anywhere in the
      # tree — including the upstream Google code this fork can't modify, so it
      # could never go green. `semgrep ci` is the CI entrypoint: it compares
      # against the PR's merge base and fails only on findings the PR
      # introduces. Inherited debt is still reported, just not gating.
      - run: semgrep ci
        env:
          SEMGREP_RULES: p/ci

  iac-scan-checkov:
    name: "Stage 9: Checkov IaC scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: true
